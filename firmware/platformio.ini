; claude-smalltv-pets firmware for the GeekMagic SmallTV Pro
; Classic ESP32, 8 MB flash, 1.54" 240x240 ST7789 (SPI mode 3), touch button on GPIO 32.
;
; Build:        pio run
; Artifact:     .pio/build/smalltv_pro/firmware.bin   (an app image, flashable over OTA)
; Flash (OTA):  ../tools/flash.sh [host]     or upload firmware.bin on http://<device>/update
;
; Board facts (pins, panel quirks, partition table) come from giovi321/smalltv-mod (WTFPL),
; which verified them on hardware.

[platformio]
default_envs = smalltv_pro

[env]
; Pinned pioarduino release (Arduino core 3.3.x / ESP-IDF 5.x), same pin as smalltv-mod.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

[env:smalltv_pro]
board = esp32dev
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; Must match the stock SmallTV Pro table: an OTA update cannot change it.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Wi-Fi is set up on the device (its ClaudePet-Setup hotspot). To bake it in
; instead: PLATFORMIO_BUILD_FLAGS='-D WIFI_SSID=\"Net\" -D WIFI_PASS=\"secret\"' pio run
build_flags =
	-D ARDUINOJSON_USE_DOUBLE=0
	-D CORE_DEBUG_LEVEL=0

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0
	ESP32Async/AsyncTCP @ ^3.4.0
	ESP32Async/ESPAsyncWebServer @ ^3.7.0
